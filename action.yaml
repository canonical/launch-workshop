name: Launch workshop
description:
  Install Workshop and use it to launch an ephemeral development environment
author: Canonical
branding:
  icon: layers
  color: orange
inputs:
  channel:
    description: Channel used to install Workshop snap.
  revision:
    description: Specific revision of Workshop snap to install.
  project:
    description: Directory containing a workshop to launch.
  workshop:
    description: Name of workshop to launch.
  cache:
    description: Mount plugs to cache across workflow runs.
runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  post-if: success()
