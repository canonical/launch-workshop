name: Launch workshop
description:
  Install Workshop and use it to launch an ephemeral development environment
author: Canonical
branding:
  icon: layers
  color: orange
inputs:
  channel:
    description: Channel used to install Workshop snap.
  revision:
    description: Specific revision of Workshop snap to install.
  project:
    description: Directory containing a workshop to launch.
  workshop:
    description: Name of workshop to launch.
  cache-key:
    description: Primary key for cached mount plugs.
    required: false
    default: ''
  restore-keys:
    description: Ordered fallback key prefixes for cached mount plugs.
    required: false
    default: ''
  cache:
    description: Mount plugs to restore before and save after the workflow.
  restore:
    description:
      Mount plugs to restore before the workflow without saving after.
runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  post-if: success()
