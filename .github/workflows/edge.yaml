name: Test Workshop compatibility

on:
  schedule:
    - cron: '00 6 * * 4,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-tests:
    name: OS tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        workshop: [focal, jammy, noble, resolute]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Launch workshop
        uses: ./
        with:
          channel: edge
          workshop: ${{ matrix.workshop }}

      - name: Check base image
        run: |
          release="$(workshop exec "$WS" lsb_release --codename --short)"
          [ "$WS" = "$release" ]
        env:
          WS: ${{ matrix.workshop }}
